[pattern]
slug = "minimal"
title = "Minimal"
dedication = ""
quote = ""
version = "0.0.1"
stitch = "sc"
size_in = [4.0, 3.0]
hook = "5 mm"
yarn_weight = "worsted"
first_row_color = "A"

[gauge]
sc = [3.5, 4.0]
square = [4.0, 4.0]

[[colors]]
code = "A"
name = "Alpha"
hex = "#112233"
yarn = "any"
use = "ground"

[[colors]]
code = "B"
name = "Beta"
hex = "#ffffff"

[notes]
setup = ["Chain W + 1 in A."]

# The shape checks `graphghan check` runs on top of row totals, palette codes and palette
# closure (#114). A bordered, mirrored blanket opts in here; an imported chart leaves this out.
[checks]
solid_edge = 1        # the outer cell all round is first_row_color
first_row_solid = true
mirror_lr = 2         # the outer 2 columns mirror each other
mirror_tb = 2         # the outer 2 rows mirror each other
