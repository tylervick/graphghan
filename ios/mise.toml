# iOS tooling. The repo-root mise.toml still applies here (uv, node, hk); this file adds what only
# ios/ needs. Run from ios/: `mise run generate && mise run test`.
[tools]
xcodegen = "2.46.0"

[tasks.generate]
description = "Generate Graphghan.xcodeproj from project.yml"
run = "xcodegen generate --quiet"

[tasks.core-test]
description = "swift test for the GraphghanCore package (macOS host, no simulator)"
dir = "Packages/GraphghanCore"
run = "swift test --quiet"

[tasks.prose-test]
description = "swift test for the ProseReader package (macOS host, no simulator, no model)"
dir = "Packages/ProseReader"
run = "swift test --quiet"

[tasks.build]
description = "Build the app for the iPhone 17 simulator"
depends = ["generate"]
run = "xcodebuild build -quiet -project Graphghan.xcodeproj -scheme Graphghan -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath build/DerivedData"

[tasks.test]
description = "Run the app target's unit tests on the iPhone 17 simulator"
depends = ["generate"]
run = "xcodebuild test -quiet -project Graphghan.xcodeproj -scheme Graphghan -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath build/DerivedData"

[tasks.script-test]
description = "Hermetic tests for the shell scripts under Scripts/"
run = """
for t in Scripts/test-*.sh; do echo "== $t"; "$t"; done
"""

[tasks.ci-test]
description = "The app tests exactly as CI runs them: render-only snapshots into build/snapshots"
depends = ["generate"]
run = """
rm -rf build/TestResults.xcresult
mkdir -p build/snapshots
TEST_RUNNER_GRAPHGHAN_SNAPSHOTS=render TEST_RUNNER_GRAPHGHAN_SNAPSHOT_OUT="$PWD/build/snapshots" \
  xcodebuild test -quiet -project Graphghan.xcodeproj -scheme Graphghan \
  -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath build/DerivedData -resultBundlePath build/TestResults.xcresult
"""

[tasks.icon]
description = "Regenerate the app icon PNG from Scripts/make_icon.py"
run = "uv run --project .. python Scripts/make_icon.py"
