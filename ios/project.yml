name: Graphghan
options:
  bundleIdPrefix: com.tylervick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GraphghanCore:
    path: Packages/GraphghanCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    # Same team as Waddle; xcodegen regenerates the project, so the team lives here, not in Xcode's pane.
    DEVELOPMENT_TEAM: 352UZEKYPP
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
    # Manual on the release path is a safety property, not a preference: automatic signing plus
    # -allowProvisioningUpdates on a runner MINTS a new Apple Distribution certificate whose key dies
    # with the runner, and Apple caps those per account. The two profiles are manually managed in the
    # portal (Scripts/asc-profiles.sh creates them) and installed on the runner from secrets.
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
targets:
  Graphghan:
    type: application
    platform: iOS
    sources:
      - path: Graphghan
      - path: Shared
      - path: Assets.xcassets
      - path: Fonts
    dependencies:
      - package: GraphghanCore
      - target: GraphghanWidgets
    entitlements:
      path: Graphghan/Graphghan.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tylervick.graphghan]
    info:
      path: Graphghan/Info.plist
      properties:
        CFBundleDisplayName: Graphghan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIAppFonts:
          - Literata-SemiBold.ttf
          - Literata-MediumItalic.ttf
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - Nunito[wght].ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # A .graphghan bundle opened from Files, Mail or AirDrop (#16). The identifier is not the
        # bundle id -- a UTI equal to one is a collision waiting to happen, and #112 wants a
        # sibling for PDFs. The tag spec declares the extension and NOT a MIME type: claiming
        # application/zip would make this app a candidate handler for every zip anyone receives.
        # Opening in place is off: a bundle is imported once and then owned by the library, so
        # there is nothing to write back.
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tylervick.graphghan.pattern-bundle
            UTTypeDescription: Graphghan Pattern
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - graphghan
        CFBundleDocumentTypes:
          - CFBundleTypeName: Graphghan Pattern
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.tylervick.graphghan.pattern-bundle
          # A pattern PDF opens the import sheet (#112): Alternate, since the app is not the app for PDFs.
          - CFBundleTypeName: Pattern PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylervick.graphghan
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        # XcodeGen's application preset sets TARGETED_DEVICE_FAMILY=1,2 at target scope, which beats the
        # project-level value; App Store validation then demands iPad icons and iPad-multitasking
        # orientations. Re-assert iPhone-only here (and on the extension) so the build matches the spec.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          # XcodeGen's application preset injects CODE_SIGN_IDENTITY=iPhone Developer at target scope,
          # which would shadow the project-level Apple Distribution under Manual signing.
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Graphghan App Store CI"
  GraphghanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Graphghan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GraphghanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GraphghanWidgets
      - path: Shared
    dependencies:
      - package: GraphghanCore
    entitlements:
      path: GraphghanWidgets/GraphghanWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tylervick.graphghan]
    info:
      path: GraphghanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Graphghan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylervick.graphghan.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Graphghan Widgets App Store CI"
schemes:
  Graphghan:
    build:
      targets:
        Graphghan: all
        GraphghanWidgets: all
        GraphghanTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GraphghanTests
