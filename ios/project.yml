name: Graphghan
options:
  bundleIdPrefix: com.tylervick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GraphghanCore:
    path: Packages/GraphghanCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    # Same team as Waddle; xcodegen regenerates the project, so the team lives here, not in Xcode's pane.
    DEVELOPMENT_TEAM: 352UZEKYPP
    CODE_SIGN_STYLE: Automatic
targets:
  Graphghan:
    type: application
    platform: iOS
    sources:
      - path: Graphghan
      - path: Assets.xcassets
    dependencies:
      - package: GraphghanCore
    entitlements:
      path: Graphghan/Graphghan.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tylervick.graphghan]
    info:
      path: Graphghan/Info.plist
      properties:
        CFBundleDisplayName: Graphghan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylervick.graphghan
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GraphghanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Graphghan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Graphghan:
    build:
      targets:
        Graphghan: all
        GraphghanTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GraphghanTests
