name: TestFlight feedback

# Every 30 minutes, TestFlight screenshot and crash submissions become GitHub issues (one each,
# never twice). The importer itself lives in tylervick/testflight-feedback, which three apps share;
# this file only says which app and how often. Manual dispatch exists for a dry run and for "I know
# feedback just arrived".
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be created without opening issues or uploading screenshots
        type: boolean
        required: false
        default: false

# Two overlapping runs would both compute an empty seen set and open duplicates.
concurrency:
  group: testflight-feedback
  cancel-in-progress: false

permissions: {}

jobs:
  import:
    uses: tylervick/testflight-feedback/.github/workflows/import.yml@6b611aa5cf08b392a955a1a3a208ef56b94d9c72 # v1.0.0
    with:
      bundle-id: com.tylervick.graphghan
      dry-run: ${{ inputs.dry_run || false }}
    # A called workflow cannot hold more than its caller grants, and the default is read-only, so
    # these have to be repeated here: issues: write to open issues, contents: write for the
    # pre-release the screenshots hang off.
    permissions:
      issues: write
      contents: write
    # Named rather than `secrets: inherit`: this repository also holds the signing certificate,
    # the provisioning profiles and their passwords, and the importer has no business seeing any
    # of them.
    secrets:
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
