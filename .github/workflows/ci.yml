name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Nothing in this job pushes; leaving the token in .git/config only widens
        # what a compromised later step could reach.
        with: {persist-credentials: false}
      # mise installs the uv/hk/linter versions mise.toml pins, so `hk check --all`
      # below runs the same tools as the local pre-commit hook rather than a
      # separately-maintained list that can drift from it.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with: {cache: true}
      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --all-groups
      - run: hk check --all
      - run: uv run pytest -q
      - name: Build site
        run: |
          if [ -f site/build.py ]; then uv run graphghan site build; else echo "no site yet"; mkdir -p site/dist; fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: {path: site/dist}
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: {group: pages, cancel-in-progress: false}
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
