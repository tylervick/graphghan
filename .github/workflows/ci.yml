name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Blink is a local agent-review tool nobody runs on a runner (see mise.toml), and a
# vendor CDN has no business standing between a push and a green build: skip its
# download rather than have a pruned pin fail `mise install` here.
#
# The Revyl CLI is pinned in the same file and is a 40 MB download that only one
# job below has any use for. Disabled here and re-enabled there, rather than the
# other way round, so a new job never picks it up by accident.
env:
  MISE_DISABLE_TOOLS: http:blink,github:RevylAI/revyl-cli
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Nothing in this job pushes; leaving the token in .git/config only widens
        # what a compromised later step could reach. fetch-depth 0 because hk's
        # gitleaks step scans commit history rather than the working tree, and a
        # shallow clone would have it report a clean scan of a single commit --
        # a green that means nothing was looked at.
        with: {persist-credentials: false, fetch-depth: 0}
      # mise installs the uv/hk/linter versions mise.toml pins, so `hk check --all`
      # below runs the same tools as the local pre-commit hook rather than a
      # separately-maintained list that can drift from it.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with: {cache: true}
      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --all-groups
      - run: hk check --all
      - run: uv run pytest -q
      - name: Build the pattern feed
        run: uv run graphghan site build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: {path: site/dist}
  # Cheap path filter so a docs-only or Python-only change never spins up a macOS runner.
  # `on.pull_request.paths` would filter the whole workflow, and the Python job must always run.
  ios-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false, fetch-depth: 0}
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then RANGE="$BASE_SHA...HEAD"; else RANGE="$BEFORE_SHA..HEAD"; fi
          # A force-push or a brand-new branch has no usable "before": run the job rather than skip it.
          if ! CHANGED="$(git diff --name-only "$RANGE" 2>/dev/null)"; then CHANGED="ios/"; fi
          if printf '%s\n' "$CHANGED" | grep -qE '^(ios/|fixtures/|schema/|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "iOS-relevant paths changed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No iOS-relevant paths changed; skipping the ios job."
          fi

  ios:
    needs: ios-changes
    if: ${{ needs.ios-changes.outputs.run == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_VERSION: "26.2"
      SIMULATOR_DEVICE: iPhone 17
      SIMULATOR_OS: "26.2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION }}
        run: |
          APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP not found on this runner image. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$APP"
          xcodebuild -version
      # jdx/mise-action v2.4.4 has no working_directory input (install_dir is deprecated), so this
      # only installs the root mise.toml tools (uv/hk/...); the Core package tests step below
      # installs ios/mise.toml's xcodegen via `mise install` run from ios/.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with: {cache: true}
      - name: Core package tests
        working-directory: ios
        run: mise install -q && mise run core-test
      - name: Script tests
        working-directory: ios
        run: mise run script-test
      - name: Verify the simulator is available
        working-directory: ios
        env:
          SIMULATOR_DEVICE: ${{ env.SIMULATOR_DEVICE }}
          SIMULATOR_OS: ${{ env.SIMULATOR_OS }}
        run: Scripts/check-simulator-available.sh "$SIMULATOR_DEVICE" "$SIMULATOR_OS"
      - name: Generate the project
        working-directory: ios
        run: mise run generate
      # Snapshot references are pinned to a developer's simulator OS, so CI renders every layout
      # (and checks sizes) instead of comparing pixels; the renders are uploaded for eyeballing.
      - name: App tests (iPhone simulator)
        working-directory: ios
        env:
          DESTINATION: platform=iOS Simulator,name=${{ env.SIMULATOR_DEVICE }},OS=${{ env.SIMULATOR_OS }}
          TEST_RUNNER_GRAPHGHAN_SNAPSHOTS: render
          TEST_RUNNER_GRAPHGHAN_SNAPSHOT_OUT: ${{ runner.temp }}/snapshots
        run: |
          xcodebuild test -project Graphghan.xcodeproj -scheme Graphghan \
            -destination "$DESTINATION" -derivedDataPath build/DerivedData \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0
      # The renders are an aid for eyeballing layouts, not a gate: the first run on this job went red
      # on a green test suite because the artifact service was unreachable (ENOTFOUND), so an upload
      # failure must not fail the job. The test results upload below stays fatal-on-failure only.
      - name: Upload rendered snapshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
  # Ships what just merged (#106, docs/release.md): the TestFlight workflow, gated inside on app code
  # having changed since the last shipped build and here on the tests having passed. `ios` may be
  # skipped (no iOS paths in this push) while a build is still owed from an earlier failed run, so a
  # skip is not a veto; a failure or a cancel is.
  testflight:
    needs: [test, ios]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    # contents: write for the ios-build-N tag the called workflow pushes; the caller's grant is the ceiling.
    permissions:
      contents: write
    concurrency:
      group: testflight
      cancel-in-progress: false
    uses: ./.github/workflows/testflight.yml
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.PROVISIONING_PROFILE_APP_BASE64 }}
      PROVISIONING_PROFILE_WIDGETS_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGETS_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
  # Publishes a standalone simulator build to Revyl so a pull request has a real
  # artifact to launch a cloud device against. `.revyl/config.yaml` sets
  # pr_review.build.kind: ci_upload_to_revyl, which means Revyl expects the
  # artifact to arrive from here rather than building the app itself -- this
  # workflow already has a macOS runner with the right Xcode standing up for the
  # `ios` job, so a cloud build would be the same compile a second time.
  #
  # A separate job rather than more steps on `ios`, for one reason: this must not
  # be gated on the tests. A build that fails its suite is frequently the exact
  # build you want on a device to watch it fail. `--no-set-current` below is the
  # other half of that -- a red build gets published but never becomes the app's
  # current version for everyone else.
  revyl-preview:
    needs: ios-changes
    # Pull requests only: the whole point is an artifact bound to a review.
    #
    # draft, because pr_review.review_triggers.drafts is false, so Revyl would
    # not review a draft's artifact even if one arrived.
    #
    # fork, because a pull request from a fork receives no secrets. This repo is
    # public, so that is a real case and not a hypothetical; deciding it here
    # means a fork contributor's pull request does not spend a macOS runner to
    # reach a step that cannot run.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.ios-changes.outputs.run == 'true'
    runs-on: macos-26
    # Headroom, not a measurement. The xcodebuild below was measured at 25s with
    # cold DerivedData on an M-series laptop; the rest of this job is a checkout
    # and a toolchain install. 30 minutes is here to stop a wedged runner burning
    # an hour, not because anything approaches it.
    timeout-minutes: 30
    env:
      XCODE_VERSION: "26.2"
      # Narrower than the workflow-level value: this is the job that wants the
      # pinned Revyl CLI. Blink stays off.
      MISE_DISABLE_TOOLS: http:blink
    steps:
      # First, and before the checkout: on a run where the secret is missing
      # every step after this one is wasted, and a macOS runner is the expensive
      # kind to waste. `secrets` is not available in a job-level `if`, which is
      # why this is a step rather than part of the condition above.
      - name: Check for the Revyl API key
        id: key
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
        run: |
          if [ -z "${REVYL_API_KEY:-}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REVYL_API_KEY is not set; skipping the Revyl preview build."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.have == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      # Same pin as the `ios` job, and for the same reason: this artifact should
      # be built by the Xcode the app is tested and shipped with.
      # `.revyl/config.yaml` names the matching Revyl build image, so a bump is a
      # three-line edit across this file and that one.
      - name: Select Xcode
        if: steps.key.outputs.have == 'true'
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION }}
        run: |
          APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP not found on this runner image. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$APP"
          xcodebuild -version
      - if: steps.key.outputs.have == 'true'
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with: {cache: true}
      # Graphghan.xcodeproj is generated and gitignored, so it is not in the
      # checkout; xcodegen comes from ios/mise.toml, which the action above does
      # not reach (it has no working_directory input).
      - name: Generate the project
        if: steps.key.outputs.have == 'true'
        working-directory: ios
        run: mise install -q && mise run generate
      # Not the `ios` job's product, and not reusable as one: that job builds
      # with ENABLE_DEBUG_DYLIB at its default, so its bundle carries
      # Graphghan.debug.dylib and __preview.dylib -- the Xcode debug-dylib
      # layout, which is not a thing to install on a device under test.
      #
      # CODE_SIGNING_ALLOWED=NO because Debug uses automatic signing
      # (ios/project.yml) and no runner is signed in; a simulator build needs no
      # signature. No ARCHS override: nothing here links a prebuilt xcframework,
      # so the generic destination builds both simulator slices and the artifact
      # installs on either kind of simulator.
      #
      # Fatal, as the upload below now is too: the only thing that can fail
      # here is the compile, and a compile that breaks only under
      # ENABLE_DEBUG_DYLIB=NO is invisible to every other job in this workflow.
      - name: Build the app (standalone simulator bundle)
        if: steps.key.outputs.have == 'true'
        run: |
          xcodebuild -project ios/Graphghan.xcodeproj -scheme Graphghan \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/RevylDerivedData \
            ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
      # Fatal, and paired with pr_review.strict_ci_check.build: true in
      # .revyl/config.yaml. Both were the other way round until #129 ran this
      # path for real; that config carries the evidence and the two-line revert.
      #
      # The failure this now catches is a silent one. A swallowed upload error
      # leaves the review with a stale artifact or none at all, and shows a
      # green check over a review that reviewed nothing -- which is worse than
      # a red one, because nothing says so.
      - name: Publish the build to Revyl
        if: steps.key.outputs.have == 'true'
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
          # Interpolated into env rather than into the script below, which is
          # what zizmor's template-injection audit asks for and what the rest of
          # this workflow already does.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PULL REQUEST HEAD sha. github.sha on a pull_request event is the
          # ephemeral merge commit, which exists on no branch and is not what
          # Revyl matches a review against.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          # Same id as build.profiles.development.ios.app_id and
          # pr_review.build.app_ids.ios in .revyl/config.yaml.
          APP_ID: "967d62a9-5f96-4a09-af6e-2204601be5ac"
        run: |
          # The pinned CLI, not `curl https://revyl.com/install.sh | sh`: that
          # installer resolves "latest" at run time, so an unpinned CI would
          # change build under the job without a commit. mise.toml owns the
          # version; `mise x --` is how this job reaches it.
          mise x -- revyl --version

          ditto -c -k --keepParent \
            ios/build/RevylDerivedData/Build/Products/Debug-iphonesimulator/Graphghan.app \
            ios/build/Graphghan.app.zip

          # Without --version the CLI names the build after the clock
          # ("20260919-010233"), which identifies nothing in a list; the PR
          # number and head sha are what someone reading the dashboard wants.
          #
          # --no-set-current is what makes running this ungated safe -- see the
          # note on the job above.
          mise x -- revyl build upload \
            --file ios/build/Graphghan.app.zip \
            --platform ios \
            --version "pr${PR_NUMBER}-$(printf '%s' "$HEAD_SHA" | cut -c1-7)" \
            --app "$APP_ID" \
            --repo "$REPO" \
            --commit "$HEAD_SHA" \
            --pr "$PR_NUMBER" \
            --no-set-current \
            --yes --json

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: {group: pages, cancel-in-progress: false}
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
