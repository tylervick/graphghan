[project]
name = "graphghan"
version = "0.2.0"
description = "Chart generator, viewer, and Claude skill for graphghan and other pixel-chart crafts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "reportlab>=5.0.1",
    "pypdfium2>=5.13.0",
]

[project.scripts]
graphghan = "graphghan.cli:main"

[project.optional-dependencies]
apple = [
    "apple-fm-sdk>=0.2.1 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphghan"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "patterns", "site/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
