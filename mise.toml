# Dev tooling for graphghan.
#
# mise owns the *tools*; uv owns Python and the package environment. Nothing
# here pins Python on purpose -- `.python-version` + `uv.lock` already do, and
# your global `idiomatic_version_file_enable_tools` is empty, so mise ignores
# `.python-version` rather than fighting uv over which interpreter wins.
#
# In a fresh checkout:
#   mise trust && mise install && mise run setup
#
# (An Orca worktree does this for you -- see orca.yaml.)

# Every tool is pinned exactly rather than "latest", for two reasons: it is what
# makes `hk check --all` mean the same thing on this laptop and in CI, and
# Renovate's mise manager can only propose bumps against a concrete version.
# renovate.json groups them into one PR.
[tools]
uv = "0.11.29"
# Must match the `amends`/`import` URLs at the top of hk.pkl. hk evaluates that
# file with its own embedded pkl, and a config written against one release is not
# guaranteed to evaluate under another. renovate.json has a custom manager that
# bumps hk.pkl in the same PR so the two cannot drift apart.
hk = "1.58.1"
# Invoked by hk steps rather than directly.
actionlint = "1.7.12"
gitleaks = "8.30.1"
zizmor = "1.29.0"
# Only needed when a workflow gains or bumps an action; see `mise run pin-actions`.
pinact = "4.1.1"

# Revyl (https://revyl.ai) runs the iOS app on cloud devices and reviews pull
# requests against it; `.revyl/config.yaml` is the recipe. Its own install path is
# `curl -fsSL https://revyl.com/install.sh | sh`, which drops an unpinned "latest"
# in ~/.revyl/bin -- outside mise, invisible to everyone else here, and different
# on every machine and every CI run. This pins it like everything above.
#
# Three things about this line are load-bearing, and all three were established by
# installing it rather than by reading a manual:
#
#   * `github:`, not `ubi:`. They are the same resolver, but mise deprecated the
#     `ubi:` prefix (removal in 2027.1.0) and Renovate prefers `github:` too.
#   * `matching_regex`. Every release carries TWO binaries per platform --
#     `revyl-darwin-arm64` and `revyl-computer-darwin-arm64` -- and left to itself
#     the resolver picks `revyl-computer`, a different program with a different
#     command set. The first sign of this is `unknown command "version"`. The
#     regex is written per-platform rather than pinned to darwin-arm64 so a Linux
#     runner resolves its own asset.
#   * `rename_exe`. The asset name is what lands on disk, so without this the
#     command is `revyl-darwin-arm64`, and nothing -- not this repo, not the docs,
#     not the CLI's own error messages -- calls it that.
#
# Renovate's mise manager reads this (github-releases on RevylAI/revyl-cli). Its
# documented gaps there are `tag_regex` and `version_prefix`; this pin uses
# neither, so bumps arrive as ordinary pull requests.
"github:RevylAI/revyl-cli" = { version = "0.1.121", matching_regex = "^revyl-(darwin|linux)-(amd64|arm64)$", rename_exe = "revyl" }

# Blink (https://blink.review) reviews each Claude Code turn's diff and hands the
# findings back to the agent. Its own install path is
# `curl -fsSL https://blink.review/install.sh | sh`, which always takes the newest
# build and drops it in ~/.local/bin -- unpinned, and invisible to everyone else
# working here. This pins it the way every other tool above is pinned, through
# mise's `http` backend.
#
# Why a raw URL rather than a registry name: Blink ships from the vendor's own
# CDN. There is no GitHub repository, no release tag, and no mise registry entry,
# so `ubi:`/`aqua:` have nothing to resolve. The CDN's download URL is
# content-addressed by the binary's own SHA-256, which turns out to be the
# stronger pin anyway -- the URL and the checksum are the same fact, so the two
# cannot drift apart and a tampered or rolled build cannot answer to this name.
#
# Three consequences to know about:
#   * Renovate cannot see this (nothing to query), so bumps are manual. Run
#     `Scripts/update-blink-pin.sh`; do not hand-edit the values below.
#   * The vendor prunes superseded content-addressed files, so an old pin
#     eventually 404s. That failure is loud, at `mise install`, and the fix is the
#     same bump script.
#   * CI never runs Blink, and a review tool has no business standing between a
#     push and a green build, so both workflows set MISE_DISABLE_TOOLS=http:blink
#     and skip the download entirely. That is also why all four platforms are
#     pinned rather than just macOS: `mise install` fails outright on a platform
#     the pin has no URL for, and the Python half of this repo is developed and
#     CI-tested on Linux.
# blink-pin:begin -- managed by Scripts/update-blink-pin.sh, do not hand-edit
[tools."http:blink"]
version = "0.1.2"
platforms.macos-arm64.url = "https://blink.review/downloads/cli/blink-darwin-arm64-2656629b96cb79471e4759c82b6b22e31167ad5239135edca5e6ff603d5cfc75.gz"
platforms.macos-arm64.checksum = "sha256:2656629b96cb79471e4759c82b6b22e31167ad5239135edca5e6ff603d5cfc75"
platforms.macos-x64.url = "https://blink.review/downloads/cli/blink-darwin-x64-b0d58f861a3dafed5f7d6c34acd711e19014f2ec2fba4da0434e5dff0e7efa2f.gz"
platforms.macos-x64.checksum = "sha256:b0d58f861a3dafed5f7d6c34acd711e19014f2ec2fba4da0434e5dff0e7efa2f"
platforms.linux-x64.url = "https://blink.review/downloads/cli/blink-linux-x64-8636962e073a50dddfbeb3498768c2ec473562c749c3f615ff516930f6ae1824.gz"
platforms.linux-x64.checksum = "sha256:8636962e073a50dddfbeb3498768c2ec473562c749c3f615ff516930f6ae1824"
platforms.linux-arm64.url = "https://blink.review/downloads/cli/blink-linux-arm64-5121fdbac9caa4110450a814a8e90e10516f354668721eaf0b3701dfaf0a880c.gz"
platforms.linux-arm64.checksum = "sha256:5121fdbac9caa4110450a814a8e90e10516f354668721eaf0b3701dfaf0a880c"
# blink-pin:end

[tasks.setup]
description = "Create .venv from uv.lock and install the git hooks"
run = """
uv sync --all-groups
hk install
"""

[tasks.lint]
description = "Everything hk checks: ruff, formatting, file hygiene, workflow + secret scans"
run = "hk check --all"

[tasks.fix]
description = "Apply every fix hk can make"
run = "hk fix --all"

[tasks.test]
description = "The full pytest suite (package, patterns, site)"
run = "uv run pytest -q"

[tasks.check]
description = "Lint and test -- the same pair CI runs"
depends = ["lint", "test"]

[tasks.pin-actions]
description = "Re-pin .github/workflows actions to commit SHAs (run after adding or bumping one)"
# zizmor enforces that actions are hash-pinned but cannot pin them itself; this
# is the fix side of that rule. It hits the GitHub API, which is why it is a
# task you run deliberately rather than an hk step on every commit.
run = "pinact run --verify .github/workflows/*.yml"

[tasks.blink-setup]
description = "Sign in to Blink and install its Claude Code review hooks (once per machine)"
# Per-developer, not per-checkout: `blink setup` writes to the USER-level
# ~/.claude/settings.json (or $CLAUDE_CONFIG_DIR), which is not something this
# repository can carry -- `.claude/` here holds the graphghan skill and nothing
# machine-specific, and whether to run an agent review hook at all is a choice
# each contributor makes for themselves. What the repository DOES carry is the
# pinned CLI above, so everyone who opts in runs the same build.
#
# Undo with `blink setup claude-code --remove`, or `blink uninstall` for the
# token and config too. Neither touches the mise pin.
run = '''
if blink auth status >/dev/null 2>&1; then
  echo "already signed in to Blink"
else
  blink auth login
fi
blink setup claude-code

# `blink setup` writes a BARE `blink review --hook claude-code` into that
# user-level settings file -- outside this repository, and outside mise's reach.
# A mise-managed blink answers that bare name only through the shims directory,
# so the hook resolves only if the shims directory is on the PATH the hook
# inherits. mise does not arrange that: both `mise activate` and `mise run`
# prepend the tool's own install directory instead, which is exactly why `blink`
# works in this task whether or not the hook will.
#
# So the check below asks about $PATH as INHERITED rather than probing with
# `command -v`: mise adds the install directory to this task's PATH but never the
# shims directory, so what it describes is the shell environment Claude Code was
# launched with.
#
# It asks mise rather than rebuilding the path from $MISE_DATA_DIR, because
# MISE_SHIMS_DIR, a `shims_dir` setting and $XDG_DATA_HOME each move that
# directory. `mise doctor` has already resolved all three, and its
# `shims_on_path` is exactly this question, answered against the PATH it
# inherited from this task.
#
# Through --json, and parsed rather than grepped: doctor's human output is a
# report whose labels and tilde-abbreviated paths can be reworded at any
# release, while the JSON is the interface meant to be read by a program. uv
# supplies the parser -- it is pinned a few lines up, so it is the one
# interpreter this task can count on, and --no-project keeps it clear of .venv
# (which need not exist yet when setup runs).
#
# Nothing here inspects an exit status, and that is required rather than sloppy.
# `mise doctor` exits 1 on ANY problem it finds -- an untrusted config file, a
# tool that another mise.toml pins and nobody installed -- while still printing
# complete JSON. Measured: a directory with an untrusted config and one
# uninstalled tool exits 1 and still reports both keys read here. Gating on the
# status would turn every unrelated complaint into "could not read
# shims_on_path" and a refused setup on a machine whose shims are fine.
#
# The parser catches nothing, which covers the same ground from the other side:
# every way this can go wrong -- doctor missing, output that is not JSON, a
# doctor that no longer reports these two keys, a typo in the key names here --
# ends in a traceback on the suppressed stderr and an empty $probe, which is the
# one condition the branches below test.
probe="$(mise doctor --json 2>/dev/null | uv run --no-project python -c '
import json, sys
doctor = json.load(sys.stdin)
print(doctor["dirs"]["shims"])
print("yes" if doctor["shims_on_path"] else "no")
' 2>/dev/null || true)"
shims="$(printf '%s\n' "$probe" | sed -n 1p)"

case "$(printf '%s\n' "$probe" | sed -n 2p)" in
  yes)
    echo "ok - $shims is on PATH, so the hook will resolve blink"
    ;;
  no)
    echo "ERROR: $shims is not on your PATH." >&2
    echo "The hook just installed runs a bare 'blink', so it would fail with" >&2
    echo "'command not found' at the end of every Claude Code turn." >&2
    echo "Add this to your shell profile, then open a new terminal:" >&2
    echo "  export PATH=\"$shims:\$PATH\"" >&2
    exit 1
    ;;
  *)
    # Fail closed: a `mise doctor` that no longer reports this is not evidence
    # that the hook works.
    echo "ERROR: could not read shims_on_path out of 'mise doctor --json'." >&2
    echo "Check by hand that mise's shims directory is on your PATH -- the hook" >&2
    echo "just installed runs a bare 'blink' and resolves it only through there." >&2
    exit 1
    ;;
esac
'''

[tasks.revyl-setup]
description = "Sign in to Revyl and install its agent skills (once per machine)"
# Per-developer, not per-checkout, for the same reason `blink-setup` is: it signs
# a person in and writes agent skills that `revyl skill update` owns afterwards.
# What the repository carries is the pinned CLI and `.revyl/config.yaml`; this
# task is the part that cannot be committed.
run = '''
# Revyl's own installer (`curl -fsSL https://revyl.com/install.sh | sh`) drops an
# unpinned binary in ~/.revyl/bin AND prepends that directory to PATH in your
# shell profile. mise APPENDS its tool directories rather than prepending them,
# so on a machine that has ever run that installer the vendor's copy wins -- in
# your shell, and inside this task. Measured here: `mise exec -- command -v revyl`
# answered /Users/.../.revyl/bin/revyl with the pin installed and active.
#
# That silently undoes the pin. The two copies agree on the day you install them
# and then drift, because `revyl upgrade` moves one of them and mise.toml the
# other, and nothing announces which one ran. So this fails closed before doing
# any work, rather than signing in and installing skills through a binary the
# repository did not choose.
#
# The test is "is the revyl that answers underneath mise's data directory",
# which accepts both the install directory and the shims directory -- either is
# mise's -- without this task needing to know which one your PATH reaches first.
pinned_dir="$(mise where 'github:RevylAI/revyl-cli')"
data_dir="${pinned_dir%/installs/*}"
found="$(command -v revyl || true)"

case "$found" in
  "$data_dir"/*)
    echo "ok - revyl resolves to $found"
    ;;
  "")
    echo "ERROR: no 'revyl' on PATH at all, even with the mise pin installed." >&2
    echo "Run 'mise install' first." >&2
    exit 1
    ;;
  *)
    echo "ERROR: 'revyl' resolves to $found, which is not mise's copy." >&2
    echo "mise.toml pins the CLI so everyone here runs the same build; that copy" >&2
    echo "is outside the pin and will drift from it. To hand the name back:" >&2
    echo >&2
    echo "  rm -rf \"\$HOME/.revyl/bin\"" >&2
    echo "  # then delete the vendor installer's line from your shell profile:" >&2
    echo "  #   export PATH=\"\$HOME/.revyl/bin:\$PATH\"" >&2
    echo >&2
    echo "Your login stays put -- it lives in ~/.revyl/credentials.json, which" >&2
    echo "removing only bin/ leaves alone." >&2
    exit 1
    ;;
esac

if revyl auth status >/dev/null 2>&1; then
  echo "already signed in to Revyl"
else
  revyl auth login
fi

# --cli --claude installs the CLI skill family into .agents/skills with Claude
# Code links under .claude/skills/revyl-*. Both are gitignored: `revyl skill
# update` owns that content, so a vendored copy would go stale against whatever
# CLI version is pinned above.
revyl skill install --cli --claude --yes

# Cheap, and it is the thing most likely to be wrong after an edit: the config
# is hand-written (the CLI's own `revyl github setup` needs a TTY).
revyl config validate
'''
